name: Build Windows app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      soak_minutes:
        description: 'Optional isolated background stability check (minutes)'
        type: choice
        default: '0'
        options: ['0', '60', '180', '300']
  schedule:
    - cron: '0 20 * * 0'

permissions:
  contents: read

jobs:
  windows:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build and check
        shell: pwsh
        run: ./scripts/check-quality.ps1 -IsolatedCi
      - name: Retain direct and transitive dependency audit
        shell: pwsh
        run: ./scripts/audit-dependencies.ps1
      - name: Keep quality reports, logs and fixture images
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-check-diagnostics
          path: |
            .local/quality-checks/**
            .local/dependency-audit/**
          if-no-files-found: warn
          retention-days: 14
      - name: Package portable app
        shell: pwsh
        run: ./scripts/publish.ps1
      - name: Package installer
        shell: pwsh
        run: ./scripts/package-installer.ps1 -Compiler (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe')
      - uses: actions/upload-artifact@v7
        with:
          name: DailyToolkit-win-x64
          path: |
            artifacts/DailyToolkit-*-win-x64-portable.zip
            artifacts/DailyToolkit-*-win-x64-setup.exe
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
  installer:
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Get the matching Windows packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name DailyToolkit-win-x64 --dir artifacts
          if ($LASTEXITCODE -ne 0) { throw 'Matching package download failed.' }
          [xml]$properties = Get-Content -LiteralPath Directory.Build.props -Raw
          $version = [string]$properties.Project.PropertyGroup.Version
          $names = @("DailyToolkit-$version-win-x64-setup.exe", "DailyToolkit-$version-win-x64-portable.zip", 'SHA256SUMS.txt')
          $files = @(Get-ChildItem -LiteralPath artifacts -File -Recurse | ForEach-Object { [IO.Path]::GetRelativePath((Join-Path $PWD artifacts), $_.FullName) })
          if (@(Compare-Object $names $files).Count) { throw 'Unexpected package artifact files.' }
          $lines = @(Get-Content -LiteralPath artifacts/SHA256SUMS.txt)
          if ($lines.Count -ne 2) { throw 'Unexpected package checksums.' }
          foreach ($line in $lines) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { throw 'Invalid package checksum.' }
            $hash = $Matches[1]; $name = $Matches[2]
            if ($name -notin $names[0..1] -or (Get-FileHash -LiteralPath (Join-Path artifacts $name) -Algorithm SHA256).Hash -ne $hash) { throw 'Package checksum mismatch.' }
          }
          Expand-Archive -LiteralPath (Join-Path artifacts $names[1]) -DestinationPath "artifacts/DailyToolkit-$version-win-x64"
      - name: Check installer lifecycle in a clean environment
        shell: pwsh
        run: ./scripts/test-installer.ps1 -Compiler (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe')
      - name: Keep installer failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: installer-check-diagnostics
          path: |
            .local/installer-tests/*.log
            .local/installer-tests/*.json
          if-no-files-found: ignore
          retention-days: 7
  background-stability:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.soak_minutes != '0')
    runs-on: windows-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build isolated fixture checks
        shell: pwsh
        run: ./scripts/build.ps1 -SkipTests
      - name: Observe repeated enable, disable and idle resource use
        shell: pwsh
        env:
          SOAK_MINUTES: ${{ github.event_name == 'schedule' && '180' || inputs.soak_minutes }}
        run: ./scripts/test-background-stability.ps1 -DurationMinutes ([int]$env:SOAK_MINUTES)
      - name: Keep stability reports and failure logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: background-stability-diagnostics
          path: .local/background-stability/**
          if-no-files-found: warn
          retention-days: 14
