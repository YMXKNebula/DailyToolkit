name: Build Windows app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build and check
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Check clipboard media and native events
        shell: pwsh
        run: |
          $checks = './tests/DailyToolkit.Desktop.Tests/bin/Release/net10.0-windows10.0.26100.0/DailyToolkit.Desktop.Tests.exe'
          & $checks --clipboard-media-checks
          if ($LASTEXITCODE -ne 0) { throw 'Clipboard media checks failed.' }
          & $checks --clipboard-native-checks
          if ($LASTEXITCODE -ne 0) { throw 'Isolated clipboard event checks failed.' }
          & $checks --clipboard-native-visuals (Join-Path $env:RUNNER_TEMP 'clipboard-panel-checks')
          if ($LASTEXITCODE -ne 0) { throw 'Clipboard panel checks failed.' }
          & $checks --clipboard-native-palette-checks (Join-Path $env:RUNNER_TEMP 'palette-checks')
          if ($LASTEXITCODE -ne 0) { throw 'Isolated palette checks failed.' }
      - name: Check FilePack packing and recovery
        shell: pwsh
        run: |
          $checks = './tests/DailyToolkit.Desktop.Tests/bin/Release/net10.0-windows10.0.26100.0/DailyToolkit.Desktop.Tests.exe'
          & $checks --clipboard-native-filepack-checks (Join-Path $env:RUNNER_TEMP 'filepack-checks')
          if ($LASTEXITCODE -ne 0) { throw 'Isolated FilePack checks failed.' }
      - name: Package portable app
        shell: pwsh
        run: ./scripts/publish.ps1
      - name: Package installer
        shell: pwsh
        run: ./scripts/package-installer.ps1 -Compiler (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe')
      - uses: actions/upload-artifact@v7
        with:
          name: DailyToolkit-win-x64
          path: |
            artifacts/DailyToolkit-*-win-x64-portable.zip
            artifacts/DailyToolkit-*-win-x64-setup.exe
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
  installer:
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Get the matching Windows packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name DailyToolkit-win-x64 --dir artifacts
          if ($LASTEXITCODE -ne 0) { throw 'Matching package download failed.' }
          [xml]$properties = Get-Content -LiteralPath Directory.Build.props -Raw
          $version = [string]$properties.Project.PropertyGroup.Version
          $names = @("DailyToolkit-$version-win-x64-setup.exe", "DailyToolkit-$version-win-x64-portable.zip", 'SHA256SUMS.txt')
          $files = @(Get-ChildItem -LiteralPath artifacts -File -Recurse | ForEach-Object { [IO.Path]::GetRelativePath((Join-Path $PWD artifacts), $_.FullName) })
          if (@(Compare-Object $names $files).Count) { throw 'Unexpected package artifact files.' }
          $lines = @(Get-Content -LiteralPath artifacts/SHA256SUMS.txt)
          if ($lines.Count -ne 2) { throw 'Unexpected package checksums.' }
          foreach ($line in $lines) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { throw 'Invalid package checksum.' }
            $hash = $Matches[1]; $name = $Matches[2]
            if ($name -notin $names[0..1] -or (Get-FileHash -LiteralPath (Join-Path artifacts $name) -Algorithm SHA256).Hash -ne $hash) { throw 'Package checksum mismatch.' }
          }
          Expand-Archive -LiteralPath (Join-Path artifacts $names[1]) -DestinationPath "artifacts/DailyToolkit-$version-win-x64"
      - name: Check installer lifecycle in a clean environment
        shell: pwsh
        run: ./scripts/test-installer.ps1 -Compiler (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe')
      - name: Keep installer failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: installer-check-diagnostics
          path: |
            .local/installer-tests/*.log
            .local/installer-tests/*.json
          if-no-files-found: ignore
          retention-days: 7
